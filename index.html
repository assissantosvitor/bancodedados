<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Super Turbo Race - HTML5</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #333; border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .info { position: absolute; top: 10px; color: white; text-align: center; pointer-events: none; }
    </style>
</head>
<body>

    <div class="info">
        <h1>Super Turbo Race</h1>
        <p>Use as setas <b>ESQUERDA</b> e <b>DIREITA</b> para desviar!</p>
        <h2 id="score">Pontos: 0</h2>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    canvas.width = 400;
    canvas.height = 600;

    let score = 0;
    let gameActive = true;

    // Configurações do Jogador
    const player = {
        x: 175,
        y: 500,
        w: 50,
        h: 80,
        color: "#ff3e3e",
        speed: 7
    };

    // Obstáculos (Outros carros)
    const enemies = [];
    const enemySpeed = 5;

    // Controles
    const keys = {};
    document.addEventListener("keydown", (e) => keys[e.code] = true);
    document.addEventListener("keyup", (e) => keys[e.code] = false);

    function spawnEnemy() {
        const lanes = [50, 150, 250, 300];
        const x = lanes[Math.floor(Math.random() * lanes.length)];
        enemies.push({ x: x, y: -100, w: 50, h: 80, color: "#61dafb" });
    }

    function update() {
        if (!gameActive) return;

        // Movimentação
        if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
        if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;

        // Lógica dos inimigos
        if (Math.random() < 0.02) spawnEnemy();

        enemies.forEach((enemy, index) => {
            enemy.y += enemySpeed;

            // Colisão
            if (player.x < enemy.x + enemy.x &&
                player.x + player.w > enemy.x &&
                player.y < enemy.y + enemy.h &&
                player.y + player.h > enemy.y) {
                gameActive = false;
                alert("GAME OVER! Pontuação: " + score);
                location.reload();
            }

            // Remover inimigos que saíram da tela e somar pontos
            if (enemy.y > canvas.height) {
                enemies.splice(index, 1);
                score += 10;
                scoreElement.innerHTML = "Pontos: " + score;
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Estrada
        ctx.fillStyle = "#444";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Faixas da estrada
        ctx.strokeStyle = "#fff";
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();

        // Desenhar Jogador (Carro Vermelho)
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);
        
        // Detalhes do carro (faróis)
        ctx.fillStyle = "yellow";
        ctx.fillRect(player.x + 5, player.y + 5, 10, 10);
        ctx.fillRect(player.x + player.w - 15, player.y + 5, 10, 10);

        // Desenhar Inimigos
        enemies.forEach(enemy => {
            ctx.fillStyle = enemy.color;
            ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
