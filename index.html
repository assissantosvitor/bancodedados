<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão NASA - Decolagem</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Espaço com estrelas simples */
        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 10vw 20vh 1px #fff, 50vw 40vh 1px #fff, 80vw 10vh 1px #fff, 20vw 80vh 1px #fff, 70vw 70vh 1px #fff;
            z-index: 0;
        }

        /* Planeta Terra Realista */
        .terra {
            position: relative;
            width: 300px;
            height: 300px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Earth_Western_Hemisphere_transparent_background.png/600px-Earth_Western_Hemisphere_transparent_background.png');
            background-size: cover;
            border-radius: 50%;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 50px rgba(65, 105, 225, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Atmosfera azulada em volta */
        .terra::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(100, 149, 237, 0.3);
        }

        /* Foguete */
        #foguete {
            position: absolute;
            bottom: 60%; /* Posicionado sobre o planeta */
            font-size: 50px;
            transition: transform 2s cubic-bezier(.47,0,.74,.71), opacity 2s;
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        /* Efeito de fogo na decolagem */
        .fogo {
            display: none;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 30px;
            background: linear-gradient(to bottom, orange, red);
            border-radius: 50%;
            filter: blur(2px);
            animation: vibrar 0.1s infinite;
        }

        @keyframes vibrar {
            0% { height: 30px; }
            50% { height: 45px; opacity: 0.8; }
            100% { height: 30px; }
        }

        button {
            margin-top: 50px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            background: #e03e3e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 4px 15px rgba(224, 62, 62, 0.4);
            transition: 0.3s;
        }

        button:hover { background: #ff4d4d; transform: scale(1.1); }
        button:disabled { background: #555; cursor: not-allowed; }

        .decolar {
            transform: translateY(-1000px) scale(0.5);
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="terra">
        <div id="foguete">
            🚀
            <div class="fogo" id="fogo"></div>
        </div>
    </div>

    <button id="btnLaunch" onclick="lancarFoguete()">Lançar para a NASA</button>

    <script>
        function lancarFoguete() {
            const foguete = document.getElementById('foguete');
            const fogo = document.getElementById('fogo');
            const btn = document.getElementById('btnLaunch');

            // 1. Ativa o fogo e desabilita o botão
            fogo.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Decolando...";

            // 2. Inicia a animação de subida
            setTimeout(() => {
                foguete.classList.add('decolar');
            }, 100);

            // 3. Redireciona para o site da NASA após a animação (2 segundos)
            setTimeout(() => {
                window.location.href = "https://www.nasa.gov";
            }, 2100);
        }
