<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foguete para a NASA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #0a0a2e 0%, #000000 70%);
      overflow: hidden;
      height: 100vh;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: transparent;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 4s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* PLANETA COM MUITO MAIS DETALHES */
    .planet {
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #0ea5e9 20%, #1e3a8a 50%, #14532d 70%);
      border-radius: 50%;
      position: relative;
      box-shadow: 
        0 0 90px #60a5fa,
        inset -80px -50px 60px rgba(0,0,0,0.7),
        inset 60px 40px 40px rgba(255,255,255,0.25);
      animation: rotate 70s linear infinite;
      z-index: 2;
    }

    .planet::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 25% 35%, rgba(255,255,255,0.25) 8%, transparent 25%),
        radial-gradient(circle at 72% 65%, rgba(163, 230, 187, 0.35) 12%, transparent 45%),
        radial-gradient(circle at 40% 75%, rgba(134, 239, 172, 0.25) 10%, transparent 30%);
      box-shadow: inset 0 0 70px rgba(0,0,0,0.6);
    }

    .atmosphere {
      position: absolute;
      top: -30px; left: -30px;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 40px solid rgba(147, 197, 253, 0.3);
      z-index: 1;
      animation: rotate 90s linear infinite reverse;
    }

    /* FOGUETE */
    .rocket {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 110px;
      z-index: 10;
      filter: drop-shadow(0 0 25px #fb923c);
      transition: transform 0.6s ease-in-out;
    }

    .rocket.launch {
      animation: takeoff 4.2s forwards cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    @keyframes takeoff {
      0%   { transform: translateX(-50%) translateY(0) rotate(0deg); }
      25%  { transform: translateX(-50%) translateY(-100px) rotate(3deg); }
      100% { transform: translateX(-50%) translateY(-1400px) rotate(-12deg); }
    }

    .flame {
      position: absolute;
      bottom: -55px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 95px;
      background: linear-gradient(transparent, #f59e0b, #ef4444, #f97316);
      border-radius: 50% 50% 40% 40%;
      opacity: 0;
      filter: blur(10px);
    }

    .rocket.launch .flame {
      opacity: 1;
      animation: flame-flicker 0.12s infinite alternate;
    }

    @keyframes flame-flicker {
      0%   { height: 75px; transform: translateX(-50%) scaleY(0.85); }
      100% { height: 110px; transform: translateX(-50%) scaleY(1.15); }
    }

    /* BOTÃO */
    .launch-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
  </style>
</head>
<body class="text-white flex items-center justify-center relative">

  <!-- Estrelas piscando -->
  <div class="stars" id="stars"></div>

  <!-- Planeta Terra bem detalhado -->
  <div class="absolute left-10 bottom-16">
    <div class="planet">
      <div class="atmosphere"></div>
    </div>
    <p class="text-center mt-6 text-blue-300 text-2xl tracking-[4px]">TERRA • MISSÃO NASA</p>
  </div>

  <!-- Foguete -->
  <div id="rocket" class="rocket">
    🚀
    <div class="flame"></div>
  </div>

  <!-- Botão DECOLAR -->
  <button onclick="launchRocket()" 
          class="launch-btn bg-red-600 hover:bg-orange-600 active:scale-95 transition-all text-white font-bold py-6 px-16 rounded-3xl text-3xl tracking-widest shadow-2xl shadow-orange-500/60">
    DECOLAR PARA A NASA
  </button>

  <script>
    // Cria 200 estrelas no fundo
    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 200; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3.5 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.top = `${Math.random() * 100}vh`;
        star.style.left = `${Math.random() * 100}vw`;
        star.style.animationDelay = `-${Math.random() * 5}s`;
        container.appendChild(star);
      }
    }

    function launchRocket() {
      const rocket = document.getElementById('rocket');
      rocket.classList.add('launch');

      // Abre o site da NASA após 1 segundo de decolagem
      setTimeout(() => {
        window.open('https://www.nasa.gov', '_blank');
      }, 1000);

      // Reseta o foguete depois da animação (para poder lançar de novo)
      setTimeout(() => {
        rocket.classList.remove('launch');
      }, 4800);
    }

    window.onload = createStars;
  </script>
</body>
</html>
