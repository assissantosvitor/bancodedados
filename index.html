<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Washington: Procedural Crawler</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'VT323', monospace; color: #0f0; }
        canvas { border: 4px solid #333; box-shadow: 0 0 20px #000; image-rendering: pixelated; }
        .stats { margin-bottom: 10px; font-size: 24px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="stats">HP: <span id="hp">100</span> | ANDAR: <span id="floor">1</span></div>
    <canvas id="ctx"></canvas>
    <div style="margin-top: 10px;">USE AS SETAS PARA EXPLORAR A MASMORRA</div>

    <script>
        const canvas = document.getElementById('ctx');
        const gl = canvas.getContext('2d');
        const TILE = 32;
        const SIZE = 21; // Deve ser ímpar
        canvas.width = canvas.height = TILE * SIZE;

        let map = [];
        let player = { x: 1, y: 1, hp: 100, floor: 1 };
        let enemies = [];

        // --- ALGORITMO DE GERAÇÃO PROCEDURAL (Random Walk) ---
        function generateMap() {
            map = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            let x = 1, y = 1;
            let cells = 0;
            const maxCells = (SIZE * SIZE) * 0.4;

            map[y][x] = 1;

            while (cells < maxCells) {
                let dir = Math.floor(Math.random() * 4);
                let nx = x, ny = y;

                if (dir === 0) ny--; else if (dir === 1) ny++;
                else if (dir === 2) nx--; else if (dir === 3) nx++;

                if (nx > 0 && nx < SIZE - 1 && ny > 0 && ny < SIZE - 1) {
                    if (map[ny][nx] === 0) {
                        map[ny][nx] = 1;
                        cells++;
                    }
                    x = nx; y = ny;
                }
            }
            // Coloca a saída
            map[y][x] = 2; 
            spawnEnemies();
        }

        function spawnEnemies() {
            enemies = [];
            for (let i = 0; i < 5 + player.floor; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * SIZE);
                    ey = Math.floor(Math.random() * SIZE);
                } while (map[ey][ex] !== 1 || (ex === player.x && ey === player.y));
                enemies.push({ x: ex, y: ey, hp: 20 });
            }
        }

        function draw() {
            gl.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    // Cálculo de distância para a Névoa de Guerra
                    let dist = Math.hypot(x - player.x, y - player.y);
                    if (dist > 5) {
                        gl.fillStyle = '#000';
                    } else {
                        if (map[y][x] === 0) gl.fillStyle = '#1a1a1a'; // Parede
                        else if (map[y][x] === 1) gl.fillStyle = '#333';   // Chão
                        else if (map[y][x] === 2) gl.fillStyle = '#f0f';   // Saída
                    }
                    gl.fillRect(x * TILE, y * TILE, TILE, TILE);
                }
            }

            // Inimigos
            enemies.forEach(en => {
                if (Math.hypot(en.x - player.x, en.y - player.y) <= 5) {
                    gl.fillStyle = '#f00';
                    gl.fillText('👾', en.x * TILE + 8, en.y * TILE + 24);
                }
            });

            // Jogador
            gl.font = "20px Arial";
            gl.fillText('🚀', player.x * TILE + 4, player.y * TILE + 24);
        }

        window.addEventListener('keydown', e => {
            let nx = player.x, ny = player.y;
            if (e.key === 'ArrowUp') ny--;
            if (e.key === 'ArrowDown') ny++;
            if (e.key === 'ArrowLeft') nx--;
            if (e.key === 'ArrowRight') nx++;

            if (map[ny][nx] !== 0) {
                // Checa inimigo
                let enemyIdx = enemies.findIndex(en => en.x === nx && en.y === ny);
                if (enemyIdx > -1) {
                    enemies[enemyIdx].hp -= 10;
                    player.hp -= 5;
                    if (enemies[enemyIdx].hp <= 0) enemies.splice(enemyIdx, 1);
                } else {
                    player.x = nx;
                    player.y = ny;
                }

                if (map[ny][nx] === 2) {
                    player.floor++;
                    player.hp += 20;
                    generateMap();
                    player.x = 1; player.y = 1;
                }
            }

            if (player.hp <= 0) {
                alert("GAME OVER! Você chegou ao andar " + player.floor);
                location.reload();
            }

            document.getElementById('hp').innerText = player.hp;
            document.getElementById('floor').innerText = player.floor;
            draw();
        });

        generateMap();
        draw();
    </script>
</body>
</html>
