<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌍 Terra Interativa com Países + Foguete NASA</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: radial-gradient(circle at center, #0b1026 0%, #000000 70%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', sans-serif;
      color: white;
      position: relative;
    }

    /* Estrelas piscando */
    .stars {
      position: fixed;
      inset: 0;
      background: transparent;
      box-shadow: 
        120px 80px 1px #fff, 340px 120px 2px #fff, 680px 50px 1px #fff,
        150px 450px 1px #fff, 520px 380px 2px #fff, 820px 520px 1px #fff,
        230px 620px 1px #fff, 710px 710px 2px #fff, 90px 850px 1px #fff,
        450px 920px 1px #fff, 980px 220px 2px #fff, 30px 300px 1px #fff,
        870px 850px 1px #fff, 600px 150px 1px #fff, 300px 700px 1px #fff;
      animation: twinkle 4s infinite alternate ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    .stars::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: 
        50px 200px 1px #fff, 750px 30px 1px #fff, 180px 900px 1px #fff,
        400px 50px 1px #fff, 950px 650px 1px #fff;
      animation: twinkle 7s infinite alternate ease-in-out;
      opacity: 0.6;
    }
    @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Globo da Terra (mais detalhado) */
    .globe {
      position: relative;
      width: 460px;
      height: 460px;
      z-index: 2;
      cursor: grab;
    }

    /* Camada de terra com continentes/países visíveis */
    .earth-land {
      position: absolute;
      inset: 0;
      background: url('https://www.solarsystemscope.com/textures/2k_earth_daymap.jpg') center/cover;
      border-radius: 50%;
      box-shadow: 
        0 0 90px rgba(0, 120, 255, 0.7),
        inset 0 0 90px rgba(0, 0, 0, 0.85);
      animation: rotateEarth 140s linear infinite;
    }

    /* Camada de nuvens (gira um pouco mais devagar) */
    .earth-clouds {
      position: absolute;
      inset: 0;
      background: url('https://www.solarsystemscope.com/textures/2k_earth_clouds.jpg') center/cover;
      border-radius: 50%;
      opacity: 0.75;
      animation: rotateEarth 220s linear infinite;
      mix-blend-mode: screen;
    }

    /* Atmosfera brilhante */
    .atmosphere {
      position: absolute;
      inset: -35px;
      border-radius: 50%;
      border: 28px solid rgba(100, 180, 255, 0.25);
      box-shadow: 0 0 120px rgba(0, 200, 255, 0.6);
      z-index: -1;
      animation: rotateEarth 140s linear infinite;
    }

    @keyframes rotateEarth {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Nomes dos países/continentes (fixos na tela, mas posicionados ao redor do globo) */
    .country-label {
      position: absolute;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 0 8px #000;
      z-index: 3;
      pointer-events: none;
      text-transform: uppercase;
    }
    .label-brasil { top: 58%; left: 18%; }
    .label-africa { top: 45%; left: 68%; }
    .label-eua    { top: 28%; left: 22%; }
    .label-europa { top: 22%; left: 55%; }
    .label-asia   { top: 35%; left: 78%; }

    /* Foguete + fogo (agora tudo se move junto) */
    .rocket-container {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 280px;
      z-index: 4;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .rocket-container:hover { transform: translateX(-50%) scale(1.08); }

    .rocket {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
      transition: transform 0.3s;
    }

    /* Chama do fogo (acompanhando perfeitamente) */
    .flame {
      position: absolute;
      bottom: -85px;
      left: 50%;
      transform: translateX(-50%);
      width: 62px;
      height: 110px;
      opacity: 0;
      pointer-events: none;
    }
    .flame div {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 26px;
      height: 85px;
      background: linear-gradient(#ffff00, #ff8800, #ff2200);
      border-radius: 50% 50% 10% 10%;
      transform: translateX(-50%);
      animation: flameFlicker 0.08s infinite alternate;
    }
    .flame div:nth-child(2) {
      width: 38px;
      height: 98px;
      background: linear-gradient(#ffffff, #ffcc00, #ff5500);
      animation-delay: 0.03s;
      opacity: 0.85;
    }
    .flame div:nth-child(3) {
      width: 14px;
      height: 65px;
      background: #ffffff;
      animation-delay: 0.07s;
    }

    @keyframes flameFlicker {
      0% { transform: translateX(-50%) scaleY(0.85); }
      100% { transform: translateX(-50%) scaleY(1.25); }
    }

    /* Rastro de fumaça (aparece no lançamento) */
    .smoke {
      position: absolute;
      bottom: -40px;
      left: 50%;
      width: 80px;
      height: 140px;
      background: radial-gradient(rgba(200,200,200,0.6) 10%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      filter: blur(12px);
      z-index: 2;
    }

    /* Animação de decolagem (tudo junto: foguete + chama + fumaça) */
    .launching .rocket-container {
      animation: takeoff 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    .launching .flame,
    .launching .smoke {
      opacity: 1;
    }

    @keyframes takeoff {
      0%   { transform: translateX(-50%) translateY(0) rotate(0deg); }
      65%  { transform: translateX(-50%) translateY(-520px) rotate(-6deg); }
      100% { transform: translateX(-50%) translateY(-1400px) rotate(-14deg); }
    }

    /* Texto informativo */
    .info {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,255,255,0.5);
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <!-- Globo da Terra -->
  <div class="globe">
    <div class="earth-land"></div>
    <div class="earth-clouds"></div>
    <div class="atmosphere"></div>

    <!-- Nomes dos países/continentes -->
    <div class="country-label label-brasil">🇧🇷 BRASIL</div>
    <div class="country-label label-africa">🌍 ÁFRICA</div>
    <div class="country-label label-eua">🇺🇸 EUA</div>
    <div class="country-label label-europa">🇪🇺 EUROPA</div>
    <div class="country-label label-asia">🌏 ÁSIA</div>
  </div>

  <!-- Foguete -->
  <div class="rocket-container" id="rocketContainer">
    <svg class="rocket" viewBox="0 0 140 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Corpo principal -->
      <rect x="45" y="65" width="50" height="200" rx="12" fill="#e5e7eb"/>
      <!-- Faixa azul NASA -->
      <rect x="47" y="95" width="46" height="36" fill="#1e40af"/>
      <!-- Janelas -->
      <circle cx="70" cy="135" r="13" fill="#1f2937"/>
      <circle cx="70" cy="175" r="13" fill="#1f2937"/>
      <!-- Nariz cônico -->
      <polygon points="45,65 70,12 95,65" fill="#f3e8ff"/>
      <!-- Aletas grandes -->
      <polygon points="45,250 20,285 45,285" fill="#1f2937"/>
      <polygon points="95,250 120,285 95,285" fill="#1f2937"/>
      <!-- Detalhes laterais -->
      <rect x="50" y="210" width="8" height="35" fill="#ef4444"/>
      <rect x="82" y="210" width="8" height="35" fill="#ef4444"/>
      <!-- Logo NASA -->
      <text x="52" y="235" font-size="11" fill="#ef4444" font-weight="bold">NASA</text>
    </svg>

    <!-- Chama do fogo -->
    <div class="flame" id="flame">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <!-- Rastro de fumaça -->
    <div class="smoke" id="smoke"></div>
  </div>

  <!-- Texto guia -->
  <div class="info" id="info">
    👆 CLIQUE NO FOGUETE PARA DECOLAR PARA A NASA 🌍🚀<br>
    <span style="font-size:11px; opacity:0.8;">Terra com continentes e países reais girando</span>
  </div>

  <script>
    const rocketContainer = document.getElementById('rocketContainer');
    const info = document.getElementById('info');

    function launchRocket() {
      rocketContainer.style.pointerEvents = 'none';
      rocketContainer.classList.add('launching');

      setTimeout(() => {
        window.open('https://www.nasa.gov', '_blank');
        
        info.innerHTML = '🚀 DECOLAGEM CONCLUÍDA!<br>Bem-vindo à NASA!';
        info.style.color = '#22c55e';
      }, 3200);
    }

    rocketContainer.addEventListener('click', launchRocket);
  </script>

</body>
</html>
  </script>

</body>
</html>
