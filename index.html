<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌍 Foguete Voando para o Espaço - NASA</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: 'Press Start 2P', cursive;
      color: #eee;
      position: relative;
    }

    /* Fundo espacial rico */
    .space-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 70%, rgba(40,0,80,0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 20%, rgba(20,40,100,0.35) 0%, transparent 70%);
      z-index: 1;
    }

    .stars-layer-1 {
      position: fixed;
      inset: 0;
      background: transparent;
      box-shadow: 
        180px 120px #fff, 420px 80px #fff, 760px 200px #fff,
        90px 480px #fff, 650px 320px #fff, 980px 580px #fff,
        300px 720px #fff, 820px 150px #fff, 50px 890px #fff,
        510px 950px #fff, 1100px 300px #fff;
      animation: twinkle1 5s infinite alternate;
      opacity: 0.9;
      z-index: 2;
    }

    .stars-layer-2 {
      position: fixed;
      inset: 0;
      box-shadow: 
        60px 220px #ddd, 880px 90px #ddd, 240px 680px #ddd,
        950px 450px #ddd, 380px 60px #ddd, 720px 850px #ddd;
      animation: twinkle2 8s infinite alternate;
      opacity: 0.6;
      z-index: 2;
    }

    @keyframes twinkle1 { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes twinkle2 { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    /* Nebulosa distante (fundo sutil) */
    .nebula {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(100,0,180,0.12) 0%, transparent 50%),
                  radial-gradient(circle at 80% 30%, rgba(0,80,180,0.10) 0%, transparent 60%);
      z-index: 1;
    }

    /* Globo da Terra - mais detalhes */
    .planet {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .earth {
      position: absolute;
      inset: 0;
      background: url('https://www.solarsystemscope.com/textures/2k_earth_daymap.jpg') center/cover no-repeat;
      border-radius: 50%;
      box-shadow: 
        inset 0 0 100px rgba(0,0,0,0.7),
        0 0 120px rgba(0,140,255,0.6);
      animation: spin 180s linear infinite;
    }

    .oceans {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,60,140,0.25) 0%, rgba(0,120,255,0.12) 100%);
      border-radius: 50%;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .clouds {
      position: absolute;
      inset: 0;
      background: url('https://www.solarsystemscope.com/textures/2k_earth_clouds.jpg') center/cover;
      border-radius: 50%;
      opacity: 0.78;
      animation: spin 260s linear infinite reverse;
      mix-blend-mode: screen;
    }

    .glow {
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      box-shadow: 
        0 0 140px rgba(80,180,255,0.7),
        inset 0 0 80px rgba(100,200,255,0.4);
      pointer-events: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Foguete + chama + fumaça */
    .rocket-launch {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      z-index: 5;
      animation: flyToSpace 12s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    .rocket {
      width: 100%;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
    }

    .flame {
      position: absolute;
      bottom: -110px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 140px;
      opacity: 1;
    }

    .flame div {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 30px;
      height: 100px;
      background: linear-gradient(to top, transparent, #ffff00, #ff8800, #ff2200);
      border-radius: 50% 50% 20% 20%;
      transform: translateX(-50%);
      animation: flicker 0.07s infinite alternate;
    }
    .flame div:nth-child(2) { width: 44px; height: 120px; background: linear-gradient(to top, transparent, #ffffff, #ffcc00, #ff5500); animation-delay: 0.03s; opacity: 0.9; }
    .flame div:nth-child(3) { width: 18px; height: 80px; background: #ffffff; animation-delay: 0.06s; }

    @keyframes flicker {
      0%   { transform: translateX(-50%) scaleY(0.9); }
      100% { transform: translateX(-50%) scaleY(1.3); }
    }

    .smoke-trail {
      position: absolute;
      bottom: -80px;
      left: 50%;
      width: 100px;
      height: 300px;
      background: linear-gradient(to bottom, rgba(180,180,180,0.5), transparent);
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.7;
      transform: translateX(-50%);
      animation: smokeFade 12s linear forwards;
    }

    @keyframes flyToSpace {
      0%   { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
      40%  { transform: translate(-50%, -50%) translateY(-400px) rotate(-4deg); }
      70%  { transform: translate(-50%, -50%) translateY(-900px) rotate(-10deg); }
      100% { transform: translate(-50%, -50%) translateY(-1800px) rotate(-18deg); opacity: 0; }
    }

    @keyframes smokeFade {
      0%   { opacity: 0.7; height: 300px; }
      100% { opacity: 0; height: 600px; }
    }

    .message {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 25px rgba(0,255,255,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="space-bg"></div>
  <div class="nebula"></div>
  <div class="stars-layer-1"></div>
  <div class="stars-layer-2"></div>

  <!-- Planeta -->
  <div class="planet">
    <div class="earth"></div>
    <div class="oceans"></div>
    <div class="clouds"></div>
    <div class="glow"></div>
  </div>

  <!-- Foguete voando -->
  <div class="rocket-launch">
    <svg class="rocket" viewBox="0 0 140 340" xmlns="http://www.w3.org/2000/svg">
      <!-- Corpo -->
      <rect x="45" y="70" width="50" height="210" rx="14" fill="#e5e7eb"/>
      <!-- Faixa NASA -->
      <rect x="47" y="100" width="46" height="40" fill="#1e40af"/>
      <!-- Janelas -->
      <circle cx="70" cy="140" r="14" fill="#111827"/>
      <circle cx="70" cy="185" r="14" fill="#111827"/>
      <!-- Nariz -->
      <polygon points="45,70 70,15 95,70" fill="#f3e8ff"/>
      <!-- Aletas -->
      <polygon points="45,260 15,300 45,300" fill="#1f2937"/>
      <polygon points="95,260 125,300 95,300" fill="#1f2937"/>
      <!-- Detalhes -->
      <rect x="50" y="220" width="10" height="40" fill="#ef4444"/>
      <rect x="80" y="220" width="10" height="40" fill="#ef4444"/>
      <text x="52" y="245" font-size="12" fill="#ef4444" font-weight="bold">NASA</text>
    </svg>

    <div class="flame">
      <div></div><div></div><div></div>
    </div>

    <div class="smoke-trail"></div>
  </div>

  <div class="message">🚀 DECOLAGEM AUTOMÁTICA – RUMO AO ESPAÇO!</div>

</body>
</html>
