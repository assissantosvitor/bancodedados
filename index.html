<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Washington: Defensor da Terra</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; color: #00f2fe; }
        canvas { display: block; cursor: crosshair; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            pointer-events: none; font-size: 20px; letter-spacing: 2px;
        }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; background: rgba(0,0,0,0.9);
            padding: 50px; border: 2px solid #00f2fe; z-index: 100;
        }
        button {
            padding: 15px 30px; background: #00f2fe; border: none;
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="ui">
        ESTRUTURA PLANETÁRIA: <span id="hp">100</span>% | SCORE: <span id="score">0</span>
    </div>

    <div id="msg">
        <h1 id="status">TERRA DESTRUÍDA</h1>
        <p>A humanidade conta com você na próxima vez.</p>
        <button onclick="reset()">REINICIAR PROTOCOLO</button>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const hpEl = document.getElementById('hp');
        const scoreEl = document.getElementById('score');
        const msgEl = document.getElementById('msg');

        let width, height, centerX, centerY;
        let score = 0;
        let hp = 100;
        let gameActive = true;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let mouse = { x: 0, y: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', shoot);
        resize();

        // Classe do Meteoro
        class Enemy {
            constructor() {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.max(width, height);
                this.x = centerX + Math.cos(angle) * dist;
                this.y = centerY + Math.sin(angle) * dist;
                this.size = Math.random() * 15 + 10;
                this.speed = (Math.random() * 1.5 + 0.5) + (score / 1000);
            }
            update() {
                const angle = Math.atan2(centerY - this.y, centerX - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
            draw() {
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.stroke();
            }
        }

        // Classe do Projétil
        class Bullet {
            constructor(angle) {
                this.x = centerX + Math.cos(angle) * 70;
                this.y = centerY + Math.sin(angle) * 70;
                this.vx = Math.cos(angle) * 8;
                this.vy = Math.sin(angle) * 8;
            }
            update() { this.x += this.vx; this.y += this.vy; }
            draw() {
                ctx.fillStyle = '#00f2fe';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function shoot() {
            if (!gameActive) return;
            const angle = Math.atan2(mouse.y - centerY, mouse.x - centerX);
            bullets.push(new Bullet(angle));
        }

        function spawn() {
            if (gameActive) {
                enemies.push(new Enemy());
                setTimeout(spawn, Math.max(200, 1000 - score/5));
            }
        }

        function drawEarth() {
            // Atmosfera
            const grad = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, 70);
            grad.addColorStop(0, '#0077be');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 75, 0, Math.PI * 2);
            ctx.fill();

            // Planeta
            ctx.fillStyle = '#004d66';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTurret() {
            const angle = Math.atan2(mouse.y - centerY, mouse.x - centerX);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);
            ctx.fillStyle = '#fff';
            ctx.fillRect(60, -5, 20, 10); // Canhão
            ctx.restore();
        }

        function update() {
            if (!gameActive) return;

            bullets.forEach((b, bi) => {
                b.update();
                if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) bullets.splice(bi, 1);
            });

            enemies.forEach((en, ei) => {
                en.update();
                
                // Colisão com a Terra
                const distToEarth = Math.hypot(centerX - en.x, centerY - en.y);
                if (distToEarth < 60 + en.size) {
                    enemies.splice(ei, 1);
                    hp -= 10;
                    hpEl.innerText = hp;
                    if (hp <= 0) gameOver();
                }

                // Colisão com Balas
                bullets.forEach((b, bi) => {
                    const dist = Math.hypot(en.x - b.x, en.y - b.y);
                    if (dist < en.size) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score += 20;
                        scoreEl.innerText = score;
                    }
                });
            });
        }

        function gameOver() {
            gameActive = false;
            msgEl.style.display = 'block';
        }

        function reset() {
            hp = 100; score = 0;
            hpEl.innerText = hp; scoreEl.innerText = score;
            enemies = []; bullets = [];
            gameActive = true;
            msgEl.style.display = 'none';
            spawn();
            loop();
        }

        function loop() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Rastro das estrelas
            ctx.fillRect(0, 0, width, height);

            drawEarth();
            drawTurret();
            bullets.forEach(b => b.draw());
            enemies.forEach(en => en.draw());

            update();
            if (gameActive) requestAnimationFrame(loop);
        }

        spawn();
        loop();
    </script>
</body>
</html>
